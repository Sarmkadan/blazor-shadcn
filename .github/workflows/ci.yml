name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/blazor-shadcn/BlazorShadcn.csproj --no-build --configuration Release --output ./artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            ./artifacts/*.nupkg
            **/TestResults/*.trx
